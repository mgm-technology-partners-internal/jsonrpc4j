buildscript {

    ext {
        set("jacksonVersion", "3.0.4")
        set("springVersion", "7.0.4")
        set("springBootVersion", "3.5.0")
        set("jettyVersion", "12.0.20")
        set("slf4jVersion", "2.0.17")
    }

    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "io.codearte.gradle.nexus:gradle-nexus-staging-plugin:0.30.0"
        classpath("com.adarshr:gradle-test-logger-plugin:4.0.0")
    }
}

plugins {
    id('jacoco')
    id('org.openrewrite.rewrite') version '7.26.0'
}

rewrite {
    activeRecipe(
        'org.openrewrite.java.jackson.UpgradeJackson_2_3',
        'org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0',
        'org.openrewrite.java.migrate.jakarta.JakartaEE10'
    )
}

dependencies {
    rewrite('org.openrewrite.recipe:rewrite-jackson:1.16.0')
    rewrite('org.openrewrite.recipe:rewrite-spring:6.24.1')
    rewrite('org.openrewrite.recipe:rewrite-migrate-java:3.27.1')
}

repositories {
    mavenLocal()
    gradlePluginPortal()
    mavenCentral()
}

apply plugin: "java"
apply plugin: "com.adarshr.test-logger"

group = "com.github.briandilley.jsonrpc4j"
version = "1.8.0-SNAPSHOT"
description = """
This project aims to provide the facility to easily implement JSON-RPC for the java programming language.
"""

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

ext {
    releaseVersion = !version.toString().endsWith('-SNAPSHOT')
}

test {
    testLogging {
        exceptionFormat 	= "FULL"
        showExceptions 		= true
        showStackTraces 	= true
        showCauses 			= true
    }
    maxParallelForks = 1
    forkEvery = 1
    maxHeapSize = "2g"
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

java {
    registerFeature('servletSupport') {
        // TODO: create a separate sourceSet for this library feature.
        //  Gradle is planning to break this in v9.0
        usingSourceSet(sourceSets.main)
    }
    registerFeature('springSupport') {
        // TODO: create a separate sourceSet for this library feature.
        //  Gradle is planning to break this in v9.0
        usingSourceSet(sourceSets.main)
    }
}

dependencies {

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // Jakarta Servlet API for servlet support
    servletSupportImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    implementation group: 'jakarta.jws', name: 'jakarta.jws-api', version: '3.0.0'

    implementation("tools.jackson.core:jackson-core:3.0.4")
    implementation("tools.jackson.core:jackson-databind:3.0.4")

    springSupportImplementation "org.springframework:spring-core:${springVersion}"
    springSupportImplementation "org.springframework:spring-context:${springVersion}"
    springSupportImplementation "org.springframework:spring-web:${springVersion}"
    springSupportImplementation "org.springframework:spring-webmvc:${springVersion}"

    implementation 'commons-codec:commons-codec:1.18.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.easymock:easymock:5.5.0'
    testImplementation("org.springframework.boot:spring-boot-starter-web:${springBootVersion}") {
        exclude module: 'logback-classic'
    }
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testImplementation("org.eclipse.jetty:jetty-server:${jettyVersion}") {
        exclude module: 'javax.servlet'
    }
    testImplementation("org.eclipse.jetty.ee10:jetty-ee10-servlet:${jettyVersion}")
    testRuntimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.24.3'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.24.3'

}


jar {
    manifest {
       attributes 'Automatic-Module-Name': 'jsonrpc4j'
   }
}

task documentationJar(type: Jar) {
    archiveClassifier.set("javadoc")
    from javadoc
}

task sourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allSource
}

artifacts {
    archives documentationJar, sourcesJar
}

apply from: 'publishing.gradle'
